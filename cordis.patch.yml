- insert:
    - id: dsh-image-generation
      name: 'dsh-image-gen-plugin'
      config:
        apiUrl: https://api.openai.com/v1
        secret: ''
        model: gpt-image-2.6-flare
        count: 1
        outputFormat: png
        outputCompression: 100
        moderation: auto
        background: auto
        complexity: auto
        safetyIdentifier: ''
        user: ''
        outputDir: ''
        fileNameFormat: '{time}-{prompt}'
        defaultResolution: auto
        requestTimeoutSec: 600
        maxEdge: 3840
        sendsModeration: true
        sendsOutputCompression: true
        sendsComplexity: true
